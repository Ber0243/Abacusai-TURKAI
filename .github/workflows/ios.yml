
name: Build TURKAI iOS IPA

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "TURKAI-asistan-ipa.zip"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

concurrency:
  group: turkai-ios-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check ZIP archive
        run: |
          set -euxo pipefail
          test -f TURKAI-asistan-ipa.zip
          unzip -t TURKAI-asistan-ipa.zip

      - name: Extract project
        run: |
          set -euxo pipefail
          mkdir -p extracted
          unzip -q TURKAI-asistan-ipa.zip -d extracted
          test -f extracted/turkai-main/ios-kabuk/scripts/ci-build.sh

      - name: Build iOS application
        working-directory: extracted/turkai-main
        run: |
          set -euxo pipefail
          chmod +x ios-kabuk/scripts/ci-build.sh
          bash ios-kabuk/scripts/ci-build.sh

      - name: Find IPA
        run: |
          set -euxo pipefail
          IPA=$(find extracted -type f -name "*.ipa" -print -quit)

          if [ -z "$IPA" ]; then
            echo "IPA bulunamadi!"
            exit 1
          fi

          mkdir -p ipa-output
          cp "$IPA" ipa-output/TURKAI-unsigned.ipa
          ls -lh ipa-output/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TURKAI-unsigned-IPA
          path: ipa-output/TURKAI-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
